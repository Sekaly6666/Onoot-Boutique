services:
  # ─── 1. Backend API Server (Node.js Express + MongoDB) ───
  - type: web
    name: onoot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5005
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: adminboutique@onoot.com
      - key: ADMIN_PASSWORD
        value: admin1234
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: onootboutique@gmail.com
      - key: SHOP_EMAIL
        value: onootboutique@gmail.com

  # ─── 2. Frontend Boutique (Site Client) ───
  - type: web
    name: onoot-boutique
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm build:boutique
    staticPublishPath: ./Onoot-Boutique/onoot-boutique/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onoot-api
          property: host

  # ─── 3. Frontend Admin (Dashboard Gestion) ───
  - type: web
    name: onoot-admin
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm build:admin
    staticPublishPath: ./onoot-boutique/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onoot-api
          property: host
