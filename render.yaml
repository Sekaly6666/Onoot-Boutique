services:
  # ─── 1. Backend API Server (Node.js Express + MongoDB) ───
  - type: web
    name: onoot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npx -y pnpm install --no-frozen-lockfile --config.confirmModulesPurge=false && (npx -y pnpm build || npx -y pnpm build:api)
    startCommand: node Onoot-Boutique/api-server/dist/index.mjs || node dist/index.mjs || npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5005
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: adminboutique@onoot.com
      - key: ADMIN_PASSWORD
        value: admin1234
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: onootboutique@gmail.com
      - key: SHOP_EMAIL
        value: onootboutique@gmail.com
      - key: API_BASE_URL
        value: https://onoot-boutique.onrender.com
      - key: BOUTIQUE_URL
        value: https://onoot-boutique.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ─── 2. Frontend Boutique (Site Client) ───
  - type: web
    name: onoot-boutique
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm build:boutique
    staticPublishPath: ./Onoot-Boutique/onoot-boutique/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onoot-api
          property: host

  # ─── 3. Frontend Admin (Dashboard Gestion) ───
  - type: web
    name: onoot-admin
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm build:admin
    staticPublishPath: ./onoot-boutique/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onoot-api
          property: host
